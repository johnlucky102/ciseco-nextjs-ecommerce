name: CI — Lint, Type-check & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Static Analysis + Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ─── Tầng 1: Static Testing ──────────────────────────────────────
      - name: "Tầng 1: ESLint"
        run: npm run lint

      - name: "Tầng 1: TypeScript type-check"
        run: npx tsc --noEmit

      # ─── Tầng 2 & 3: Unit + Integration + Component Tests ──────────
      - name: "Tầng 2-3: Jest (unit + integration + component)"
        run: npx jest --ci --coverage --maxWorkers=2 --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary

      # ─── Coverage summary in GitHub job summary ───────────────────
      - name: Coverage summary
        if: always()
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.json | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).total;
            console.log('Statements : ' + d.statements.pct + '%');
            console.log('Branches   : ' + d.branches.pct + '%');
            console.log('Functions  : ' + d.functions.pct + '%');
            console.log('Lines      : ' + d.lines.pct + '%');
          " >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # ─── Upload coverage report ──────────────────────────────────────
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
